# Trusted Bash configuration; one file per MTCore profile. Recommended mode: 0600.
LOG_TO_CONSOLE=1
LOGGER_TAG=mtguardianx-demo
MT_CORE_SERVER_NAME='Example server'
MT_CORE_DIR=/opt/mtcore
MT_CORE_PROFILE=Demo_Profile
MT_CORE_ARGS=(--no-update)

# Seconds; repeated crashes back off up to the configured maximum.
MONITOR_POLL_INTERVAL=2
MT_CORE_RESTART_DELAY=2
MT_CORE_MAX_RESTARTS_PER_WINDOW=5
MT_CORE_RESTART_WINDOW_SECONDS=60
MT_CORE_MAX_RESTART_DELAY=60

# Best-effort event snapshots, not periodic heartbeat telemetry.
# Provision these directories for the service account (the example unit does so).
MTGX_STATE_ROOT=/run/mtguardianx
MTGX_LOG_ROOT=/var/log/mtguardianx
MTGX_REPORT_LOG_LINES=1000
MTGX_LOG_GLOBS=('/opt/mtcore/logs/*.log')
# Controls consumption; --request-restart can still queue a file when this is 0.
MTGX_ALLOW_REQUEST_RESTART=0

TG_NOTIFICATIONS=0
TG_API_TOKEN=''
TG_CHAT_ID='' # Space-separated chat IDs when enabled.
